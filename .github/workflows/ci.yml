name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out editable deck source
        uses: actions/checkout@v4
        with:
          repository: mzareei/mzareei.github.io
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          COURSE_PLATFORM_BACKEND_ROOT: ${{ github.workspace }}/backend
      - run: npm run typecheck
      - run: npx vite build
